[package]
name = "datafusion_pg_catalog"
version = "0.1.0"
edition = "2021"
publish = false
# Bare `cargo run` launches the server, not the gen_schema_ipc helper bin
# (which is run explicitly via `cargo run --bin gen_schema_ipc`).
default-run = "datafusion_pg_catalog"

[lib]
path = "src/lib.rs"

[dependencies]
datafusion = "54.0.0"
sqlparser = { version = "0.62", features = ["visitor"] }
arrow = "58.3.0"
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
async-trait = "0.1"
uuid = { version = "1.23.2", features = ["v4"] }
pgwire = "0.40"
futures = "0.3.32"
anyhow = "1.0.102"
bytes = "1.11.1"
log = "0.4.31"
env_logger = "0.11"
once_cell = "1.21.4"
datafusion-functions-aggregate = "54.0.0"
zip = "8"
# Build-time identifier concatenation so one declarative line per catalog function
# generates its explicit `set_<fn>_resolver` API (see runtime_function_resolvers).
paste = "1"

[dev-dependencies]
tempfile = "3"

# Full debug info makes every binary carry the debug info of DataFusion, Arrow and
# this crate: test binaries reached 1.3 GB each, and linking eleven of them (one per
# integration test) took gigabytes of linker memory apiece, so a `cargo test` on a
# 12-core box thrashed for the better part of an hour. Line tables keep panics and
# backtraces pointing at file:line - what the test suite actually needs - while
# `unpacked` leaves the rest beside the binary instead of inside it. Raise this to
# `debug = true` when stepping through a debugger.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
