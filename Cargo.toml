[package]
name = "datafusion_query_parser"
version = "0.1.0"
edition = "2021"

[dependencies]
datafusion = "=20.0.0"

sqlparser = "0.55.0"
#arrow = "54.2.1"
#arrow = "55.0.0"
#arrow = "=46.0.0"
arrow = "=30.0.0"
arrow-array = "=30.0.0"
arrow-schema = "=30.0.0"
#arrow-flight = "=30.0.0" # Removed to simplify dependencies
arrow-buffer = "=30.0.0"
arrow-cast = "=30.0.0"
arrow-ord = "=30.0.0"
arrow-row = "=30.0.0"
arrow-select = "=30.0.0"
arrow-string = "=30.0.0"
arrow-ipc = "=30.0.0"

chrono = "0.4.40"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
async-trait = "0.1" # Reverted to original
uuid = { version = "1.16.0", features = ["v4"] }
pgwire = "0.28.0"
futures = "0.3.31"
anyhow = "1.0.98"
bytes = "1.10.1"
log = "0.4.27"
once_cell = "1.21.3"
#datafusion-functions-aggregate = "47.0.0" # Removed as per instruction

[dev-dependencies]
tempfile = "3"
