[package]
name = "datafusion_pg_catalog"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
datafusion = "53.1.0"
sqlparser = { version = "0.62", features = ["visitor"] }
arrow = "58.3.0"
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
async-trait = "0.1"
uuid = { version = "1.23.2", features = ["v4"] }
pgwire = "0.40"
futures = "0.3.32"
anyhow = "1.0.102"
bytes = "1.11.1"
log = "0.4.31"
env_logger = "0.11"
once_cell = "1.21.4"
datafusion-functions-aggregate = "53.1.0"
zip = "8"
df_subquery_udf = { git = "https://github.com/ybrs/corr-subq-udf-rs", branch = "main" }

[dev-dependencies]
tempfile = "3"
