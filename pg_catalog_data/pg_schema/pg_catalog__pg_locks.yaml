public:
  pg_catalog:
    pg_locks:
      type: view
      view_sql: " SELECT locktype,\n    database,\n    relation,\n    page,\n    tuple,\n\
        \    virtualxid,\n    transactionid,\n    classid,\n    objid,\n    objsubid,\n\
        \    virtualtransaction,\n    pid,\n    mode,\n    granted,\n    fastpath,\n\
        \    waitstart\n   FROM pg_lock_status() l(locktype, database, relation, page,\
        \ tuple, virtualxid, transactionid, classid, objid, objsubid, virtualtransaction,\
        \ pid, mode, granted, fastpath, waitstart);"
      schema:
        locktype: varchar(256)
        database: int
        relation: int
        page: int
        tuple: int
        virtualxid: varchar(256)
        transactionid: varchar(256)
        classid: int
        objid: int
        objsubid: int
        virtualtransaction: varchar(256)
        pid: int
        mode: varchar(256)
        granted: boolean
        fastpath: boolean
        waitstart: varchar(256)
      pg_types:
        locktype: text
        database: oid
        relation: oid
        page: int4
        tuple: int2
        virtualxid: text
        transactionid: xid
        classid: oid
        objid: oid
        objsubid: int2
        virtualtransaction: text
        pid: int4
        mode: text
        granted: bool
        fastpath: bool
        waitstart: timestamptz
      rows: []
