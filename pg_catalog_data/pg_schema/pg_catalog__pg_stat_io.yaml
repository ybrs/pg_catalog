public:
  pg_catalog:
    pg_stat_io:
      type: view
      view_sql: " SELECT backend_type,\n    object,\n    context,\n    reads,\n  \
        \  read_time,\n    writes,\n    write_time,\n    writebacks,\n    writeback_time,\n\
        \    extends,\n    extend_time,\n    op_bytes,\n    hits,\n    evictions,\n\
        \    reuses,\n    fsyncs,\n    fsync_time,\n    stats_reset\n   FROM pg_stat_get_io()\
        \ b(backend_type, object, context, reads, read_time, writes, write_time, writebacks,\
        \ writeback_time, extends, extend_time, op_bytes, hits, evictions, reuses,\
        \ fsyncs, fsync_time, stats_reset);"
      schema:
        backend_type: varchar(256)
        object: varchar(256)
        context: varchar(256)
        reads: bigint
        read_time: float8
        writes: bigint
        write_time: float8
        writebacks: bigint
        writeback_time: float8
        extends: bigint
        extend_time: float8
        op_bytes: bigint
        hits: bigint
        evictions: bigint
        reuses: bigint
        fsyncs: bigint
        fsync_time: float8
        stats_reset: varchar(256)
      pg_types:
        backend_type: text
        object: text
        context: text
        reads: int8
        read_time: float8
        writes: int8
        write_time: float8
        writebacks: int8
        writeback_time: float8
        extends: int8
        extend_time: float8
        op_bytes: int8
        hits: int8
        evictions: int8
        reuses: int8
        fsyncs: int8
        fsync_time: float8
        stats_reset: timestamptz
      rows: []
