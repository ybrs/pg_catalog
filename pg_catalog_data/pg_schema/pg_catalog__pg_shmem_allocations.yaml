public:
  pg_catalog:
    pg_shmem_allocations:
      type: view
      view_sql: " SELECT name,\n    off,\n    size,\n    allocated_size\n   FROM pg_get_shmem_allocations()\
        \ pg_get_shmem_allocations(name, off, size, allocated_size);"
      schema:
        name: varchar(256)
        'off': bigint
        size: bigint
        allocated_size: bigint
      pg_types:
        name: text
        'off': int8
        size: int8
        allocated_size: int8
      rows: []
