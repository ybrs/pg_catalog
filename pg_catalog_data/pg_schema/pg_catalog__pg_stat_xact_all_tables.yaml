public:
  pg_catalog:
    pg_stat_xact_all_tables:
      type: view
      view_sql: " SELECT c.oid AS relid,\n    n.nspname AS schemaname,\n    c.relname,\n\
        \    pg_stat_get_xact_numscans(c.oid) AS seq_scan,\n    pg_stat_get_xact_tuples_returned(c.oid)\
        \ AS seq_tup_read,\n    sum(pg_stat_get_xact_numscans(i.indexrelid))::bigint\
        \ AS idx_scan,\n    sum(pg_stat_get_xact_tuples_fetched(i.indexrelid))::bigint\
        \ + pg_stat_get_xact_tuples_fetched(c.oid) AS idx_tup_fetch,\n    pg_stat_get_xact_tuples_inserted(c.oid)\
        \ AS n_tup_ins,\n    pg_stat_get_xact_tuples_updated(c.oid) AS n_tup_upd,\n\
        \    pg_stat_get_xact_tuples_deleted(c.oid) AS n_tup_del,\n    pg_stat_get_xact_tuples_hot_updated(c.oid)\
        \ AS n_tup_hot_upd,\n    pg_stat_get_xact_tuples_newpage_updated(c.oid) AS\
        \ n_tup_newpage_upd\n   FROM pg_class c\n     LEFT JOIN pg_index i ON c.oid\
        \ = i.indrelid\n     LEFT JOIN pg_namespace n ON n.oid = c.relnamespace\n\
        \  WHERE c.relkind = ANY (ARRAY['r'::\"char\", 't'::\"char\", 'm'::\"char\"\
        , 'p'::\"char\"])\n  GROUP BY c.oid, n.nspname, c.relname;"
      schema:
        relid: int
        schemaname: varchar(64)
        relname: varchar(64)
        seq_scan: bigint
        seq_tup_read: bigint
        idx_scan: bigint
        idx_tup_fetch: bigint
        n_tup_ins: bigint
        n_tup_upd: bigint
        n_tup_del: bigint
        n_tup_hot_upd: bigint
        n_tup_newpage_upd: bigint
      pg_types:
        relid: oid
        schemaname: name
        relname: name
        seq_scan: int8
        seq_tup_read: int8
        idx_scan: int8
        idx_tup_fetch: int8
        n_tup_ins: int8
        n_tup_upd: int8
        n_tup_del: int8
        n_tup_hot_upd: int8
        n_tup_newpage_upd: int8
      rows: []
