public:
  pg_catalog:
    pg_available_extensions:
      type: system_catalog
      schema:
        name: varchar(64)
        default_version: varchar(256)
        installed_version: varchar(256)
        comment: varchar(256)
      pg_types:
        name: name
        default_version: text
        installed_version: text
        comment: text
      rows:
      - name: cube
        default_version: '1.5'
        installed_version: null
        comment: data type for multidimensional cubes
      - name: amcheck
        default_version: '1.4'
        installed_version: null
        comment: functions for verifying relation integrity
      - name: hstore_plpython3u
        default_version: '1.0'
        installed_version: null
        comment: transform between hstore and plpython3u
      - name: pgstattuple
        default_version: '1.5'
        installed_version: null
        comment: show tuple-level statistics
      - name: autoinc
        default_version: '1.0'
        installed_version: null
        comment: functions for autoincrementing fields
      - name: lo
        default_version: '1.1'
        installed_version: null
        comment: Large Object maintenance
      - name: pg_prewarm
        default_version: '1.2'
        installed_version: null
        comment: prewarm relation data
      - name: seg
        default_version: '1.4'
        installed_version: null
        comment: data type for representing line segments or floating-point intervals
      - name: bloom
        default_version: '1.0'
        installed_version: null
        comment: bloom access method - signature file based index
      - name: plpgsql
        default_version: '1.0'
        installed_version: '1.0'
        comment: PL/pgSQL procedural language
      - name: insert_username
        default_version: '1.0'
        installed_version: null
        comment: functions for tracking who changed a table
      - name: intarray
        default_version: '1.5'
        installed_version: null
        comment: functions, operators, and index support for 1-D arrays of integers
      - name: hstore
        default_version: '1.8'
        installed_version: null
        comment: data type for storing sets of (key, value) pairs
      - name: ltree_plpython3u
        default_version: '1.0'
        installed_version: null
        comment: transform between ltree and plpython3u
      - name: sslinfo
        default_version: '1.2'
        installed_version: null
        comment: information about SSL certificates
      - name: tcn
        default_version: '1.0'
        installed_version: null
        comment: Triggered change notifications
      - name: pageinspect
        default_version: '1.12'
        installed_version: null
        comment: inspect the contents of database pages at a low level
      - name: tablefunc
        default_version: '1.0'
        installed_version: null
        comment: functions that manipulate whole tables, including crosstab
      - name: refint
        default_version: '1.0'
        installed_version: null
        comment: functions for implementing referential integrity (obsolete)
      - name: ltree
        default_version: '1.3'
        installed_version: null
        comment: data type for hierarchical tree-like structures
      - name: fuzzystrmatch
        default_version: '1.2'
        installed_version: null
        comment: determine similarities and distance between strings
      - name: pg_surgery
        default_version: '1.0'
        installed_version: null
        comment: extension to perform surgery on a damaged relation
      - name: intagg
        default_version: '1.1'
        installed_version: null
        comment: integer aggregator and enumerator (obsolete)
      - name: pgrowlocks
        default_version: '1.2'
        installed_version: null
        comment: show row-level locking information
      - name: pg_trgm
        default_version: '1.6'
        installed_version: null
        comment: text similarity measurement and index searching based on trigrams
      - name: earthdistance
        default_version: '1.2'
        installed_version: null
        comment: calculate great-circle distances on the surface of the Earth
      - name: unaccent
        default_version: '1.1'
        installed_version: null
        comment: text search dictionary that removes accents
      - name: dblink
        default_version: '1.2'
        installed_version: null
        comment: connect to other PostgreSQL databases from within a database
      - name: uuid-ossp
        default_version: '1.1'
        installed_version: null
        comment: generate universally unique identifiers (UUIDs)
      - name: btree_gin
        default_version: '1.3'
        installed_version: null
        comment: support for indexing common datatypes in GIN
      - name: jsonb_plpython3u
        default_version: '1.0'
        installed_version: null
        comment: transform between jsonb and plpython3u
      - name: plpython3u
        default_version: '1.0'
        installed_version: null
        comment: PL/Python3U untrusted procedural language
      - name: dict_int
        default_version: '1.0'
        installed_version: null
        comment: text search dictionary template for integers
      - name: postgres_fdw
        default_version: '1.1'
        installed_version: null
        comment: foreign-data wrapper for remote PostgreSQL servers
      - name: pgcrypto
        default_version: '1.3'
        installed_version: null
        comment: cryptographic functions
      - name: moddatetime
        default_version: '1.0'
        installed_version: null
        comment: functions for tracking last modification time
      - name: pg_freespacemap
        default_version: '1.2'
        installed_version: null
        comment: examine the free space map (FSM)
      - name: xml2
        default_version: '1.1'
        installed_version: null
        comment: XPath querying and XSLT
      - name: pg_buffercache
        default_version: '1.5'
        installed_version: null
        comment: examine the shared buffer cache
      - name: tsm_system_time
        default_version: '1.0'
        installed_version: null
        comment: TABLESAMPLE method which accepts time in milliseconds as a limit
      - name: dict_xsyn
        default_version: '1.0'
        installed_version: null
        comment: text search dictionary template for extended synonym processing
      - name: citext
        default_version: '1.6'
        installed_version: null
        comment: data type for case-insensitive character strings
      - name: pg_visibility
        default_version: '1.2'
        installed_version: null
        comment: examine the visibility map (VM) and page-level visibility info
      - name: isn
        default_version: '1.2'
        installed_version: null
        comment: data types for international product numbering standards
      - name: pg_walinspect
        default_version: '1.1'
        installed_version: null
        comment: functions to inspect contents of PostgreSQL Write-Ahead Log
      - name: tsm_system_rows
        default_version: '1.0'
        installed_version: null
        comment: TABLESAMPLE method which accepts number of rows as a limit
      - name: btree_gist
        default_version: '1.7'
        installed_version: null
        comment: support for indexing common datatypes in GiST
      - name: file_fdw
        default_version: '1.0'
        installed_version: null
        comment: foreign-data wrapper for flat file access
      - name: pg_stat_statements
        default_version: '1.11'
        installed_version: null
        comment: track planning and execution statistics of all SQL statements executed
