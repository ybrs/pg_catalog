public:
  pg_catalog:
    pg_stat_slru:
      type: view
      view_sql: " SELECT name,\n    blks_zeroed,\n    blks_hit,\n    blks_read,\n\
        \    blks_written,\n    blks_exists,\n    flushes,\n    truncates,\n    stats_reset\n\
        \   FROM pg_stat_get_slru() s(name, blks_zeroed, blks_hit, blks_read, blks_written,\
        \ blks_exists, flushes, truncates, stats_reset);"
      schema:
        name: varchar(256)
        blks_zeroed: bigint
        blks_hit: bigint
        blks_read: bigint
        blks_written: bigint
        blks_exists: bigint
        flushes: bigint
        truncates: bigint
        stats_reset: varchar(256)
      pg_types:
        name: text
        blks_zeroed: int8
        blks_hit: int8
        blks_read: int8
        blks_written: int8
        blks_exists: int8
        flushes: int8
        truncates: int8
        stats_reset: timestamptz
      rows: []
