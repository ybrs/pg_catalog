public:
  pg_catalog:
    pg_backend_memory_contexts:
      type: view
      view_sql: " SELECT name,\n    ident,\n    parent,\n    level,\n    total_bytes,\n\
        \    total_nblocks,\n    free_bytes,\n    free_chunks,\n    used_bytes\n \
        \  FROM pg_get_backend_memory_contexts() pg_get_backend_memory_contexts(name,\
        \ ident, parent, level, total_bytes, total_nblocks, free_bytes, free_chunks,\
        \ used_bytes);"
      schema:
        name: varchar(256)
        ident: varchar(256)
        parent: varchar(256)
        level: int
        total_bytes: bigint
        total_nblocks: bigint
        free_bytes: bigint
        free_chunks: bigint
        used_bytes: bigint
      pg_types:
        name: text
        ident: text
        parent: text
        level: int4
        total_bytes: int8
        total_nblocks: int8
        free_bytes: int8
        free_chunks: int8
        used_bytes: int8
      rows: []
