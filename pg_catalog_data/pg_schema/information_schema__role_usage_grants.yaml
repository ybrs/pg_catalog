public:
  information_schema:
    role_usage_grants:
      type: view
      view_sql: " SELECT grantor,\n    grantee,\n    object_catalog,\n    object_schema,\n\
        \    object_name,\n    object_type,\n    privilege_type,\n    is_grantable\n\
        \   FROM information_schema.usage_privileges\n  WHERE (grantor::name IN (\
        \ SELECT enabled_roles.role_name\n           FROM information_schema.enabled_roles))\
        \ OR (grantee::name IN ( SELECT enabled_roles.role_name\n           FROM information_schema.enabled_roles));"
      schema:
        grantor: varchar(64)
        grantee: varchar(64)
        object_catalog: varchar(64)
        object_schema: varchar(64)
        object_name: varchar(64)
        object_type: varchar(256)
        privilege_type: varchar(256)
        is_grantable: varchar(256)
      pg_types:
        grantor: name
        grantee: name
        object_catalog: name
        object_schema: name
        object_name: name
        object_type: varchar
        privilege_type: varchar
        is_grantable: varchar
      rows:
      - grantor: sysuser
        grantee: PUBLIC
        object_catalog: postgres
        object_schema: pg_catalog
        object_name: default
        object_type: COLLATION
        privilege_type: USAGE
        is_grantable: 'NO'
      - grantor: sysuser
        grantee: PUBLIC
        object_catalog: postgres
        object_schema: pg_catalog
        object_name: C
        object_type: COLLATION
        privilege_type: USAGE
        is_grantable: 'NO'
      - grantor: sysuser
        grantee: PUBLIC
        object_catalog: postgres
        object_schema: pg_catalog
        object_name: POSIX
        object_type: COLLATION
        privilege_type: USAGE
        is_grantable: 'NO'
      - grantor: sysuser
        grantee: PUBLIC
        object_catalog: postgres
        object_schema: pg_catalog
        object_name: ucs_basic
        object_type: COLLATION
        privilege_type: USAGE
        is_grantable: 'NO'
      - grantor: sysuser
        grantee: PUBLIC
        object_catalog: postgres
        object_schema: pg_catalog
        object_name: pg_c_utf8
        object_type: COLLATION
        privilege_type: USAGE
        is_grantable: 'NO'
      - grantor: sysuser
        grantee: PUBLIC
        object_catalog: postgres
        object_schema: pg_catalog
        object_name: unicode
        object_type: COLLATION
        privilege_type: USAGE
        is_grantable: 'NO'
      - grantor: sysuser
        grantee: PUBLIC
        object_catalog: postgres
        object_schema: pg_catalog
