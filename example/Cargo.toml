[package]
name = "pg_catalog_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
arrow = "58.3.0"
# Must track the parent crate's datafusion (Cargo.toml at the repo root).
# The two are linked into one binary, so a version skew makes DataFusionError
# and every other shared type two distinct types and the example stops building.
datafusion = "54.0.0"
# The LOCAL crate, not the published one. Building against the git version meant
# this example compiled a different library than the one in this tree: it still
# called get_base_session_context with a fourth argument the local signature
# dropped, and compiled, so the suite that fmt/clippy/pytests it every commit
# was asserting that a published snapshot still works.
datafusion_pg_catalog = { path = ".." }
rusqlite = "0.40.0"
tokio = { version = "1.52.3", features = ["full"] }
